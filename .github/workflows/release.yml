name: Release macOS build

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload assets to, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel

    runs-on: ${{ matrix.runner }}

    env:
      FLUTTER_VERSION: 3.38.10
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACKAGE_ARCH: ${{ matrix.arch }}

    steps:
      - name: Resolve release tag
        id: release_meta
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ inputs.tag }}"
          fi

          if [[ -z "$tag" ]]; then
            echo "Release tag is required." >&2
            exit 1
          fi

          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release_meta.outputs.tag }}
          fetch-depth: 0

      - name: Validate pubspec version
        shell: bash
        run: |
          pubspec_version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          release_version="${{ steps.release_meta.outputs.version }}"

          if [[ "$pubspec_version" != "$release_version" ]]; then
            echo "Tag version ($release_version) does not match pubspec.yaml ($pubspec_version)." >&2
            exit 1
          fi

      - name: Install Flutter SDK
        shell: bash
        run: |
          git clone https://github.com/flutter/flutter.git \
            --depth 1 \
            --branch "${FLUTTER_VERSION}" \
            "${HOME}/flutter"
          export PATH="${HOME}/flutter/bin:${PATH}"
          echo "${HOME}/flutter/bin" >> "${GITHUB_PATH}"
          flutter --disable-analytics --version

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Precache macOS artifacts
        run: flutter precache --macos

      - name: Build release artifacts
        run: ./scripts/build_release_artifacts.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ steps.release_meta.outputs.version }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

      - name: Upload assets to GitHub Release
        shell: bash
        run: |
          gh release upload "${{ steps.release_meta.outputs.tag }}" \
            dist/*.dmg \
            dist/*.sha256 \
            --clobber
